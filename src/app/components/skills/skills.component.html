<section class="skills section-padding" id="skills">
  <div class="container">
    <div class="text-center">
      <p class="section-eyebrow reveal">Technical Expertise</p>
      <h2 class="section-title reveal">Skills & <span class="gradient-text">Technologies</span></h2>
      <p class="section-subtitle reveal">Comprehensive tech stack organized across core engineering domains</p>
    </div>

    <div class="skills-grid">
      @for (cat of categories; track cat.title; let i = $index) {
        <div class="skill-cat-card glass-card reveal" [style.transition-delay.ms]="i * 80" [style.--accent]="cat.color" [style.--accent-rgb]="cat.colorRgb">
          <div class="cat-header">
            <span class="cat-icon">{{ cat.icon }}</span>
            <h3 class="cat-title">{{ cat.title }}</h3>
          </div>

          <div class="cat-skills-list">
            @for (s of cat.skills; track s.name) {
              <div class="skill-chip">
                <span class="skill-emoji">{{ s.icon }}</span>
                <span class="skill-name">{{ s.name }}</span>
              </div>
            }
          </div>
          <div class="cat-glow"></div>
        </div>
      }
    </div>
  </div>
</section>
