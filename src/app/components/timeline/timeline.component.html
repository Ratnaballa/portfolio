<section class="timeline section-padding" id="timeline">
  <div class="container">
    <div class="text-center">
      <p class="section-eyebrow reveal">My Story</p>
      <h2 class="section-title reveal">The <span class="gradient-text">Journey</span> So Far</h2>
      <p class="section-subtitle reveal">Every chapter has been a stepping stone to something greater</p>
    </div>

    <div class="tl-wrap">
      <div class="tl-spine"></div>

      @for (ev of events; track ev.title; let i = $index) {
        <div class="tl-entry"
             [class.right]="i % 2 === 1"
             [class.reveal-left]="i % 2 === 0"
             [class.reveal-right]="i % 2 === 1"
             [style.transition-delay.ms]="i * 100">

          <div class="tl-node" [class]="ev.type">
            <span>{{ ev.icon }}</span>
            <div class="node-pulse"></div>
          </div>

          <div class="tl-card glass-card" [class]="ev.type + '-card'">
            <div class="tl-card-header">
              <div class="tl-year-badge" [class]="ev.type">{{ ev.year }}</div>
              <span class="tl-type-tag" [class]="ev.type">{{ ev.type }}</span>
            </div>
            <h3 class="tl-title">{{ ev.title }}</h3>
            <p class="tl-org">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                <path d="M6 12v5c3 3 9 3 12 0v-5"/>
              </svg>
              {{ ev.org }}
            </p>
            <p class="tl-desc">{{ ev.desc }}</p>
          </div>
        </div>
      }

      <!-- End cap -->
      <div class="tl-end reveal">
        <div class="tl-end-dot">✨</div>
        <p>The story continues...</p>
      </div>
    </div>
  </div>
</section>
